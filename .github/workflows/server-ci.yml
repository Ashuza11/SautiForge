name: Community service verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/server-ci.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'server/**'
      - 'src/features/projects/domain/project.ts'

permissions:
  contents: read

concurrency:
  group: community-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify service types and tests
        run: |
          npm run typecheck:server
          npm test -- --run server
