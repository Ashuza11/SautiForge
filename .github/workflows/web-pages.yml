name: Web annotation workspace

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/web-pages.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'web/**'
      - 'src/features/annotations/domain/**'
      - 'src/features/exports/domain/**'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify web source
        run: |
          npm run typecheck
          npm test -- --run web/src

      - name: Build static workspace
        run: npm run web:build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
