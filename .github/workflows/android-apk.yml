name: Android pilot APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'assets/**'
      - 'src/**'

permissions:
  contents: read

concurrency:
  group: android-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install locked dependencies
        run: npm ci

      - name: Verify TypeScript and automated tests
        run: |
          npm run typecheck
          npm test

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build standalone release APK
        working-directory: android
        env:
          EXPO_USE_PRECOMPILED_MODULES: '1'
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Name APK and calculate SHA-256
        shell: bash
        run: |
          mkdir -p artifacts
          short_sha="${GITHUB_SHA:0:8}"
          apk_name="sautiforge-0.1.0-${short_sha}-pilot.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/${apk_name}"
          apk_sha="$(sha256sum "artifacts/${apk_name}" | cut -d ' ' -f 1)"
          printf '%s  %s\n' "${apk_sha}" "${apk_name}" > "artifacts/${apk_name}.sha256"
          {
            echo '### Android pilot APK'
            echo
            echo "- File: \`${apk_name}\`"
            echo "- SHA-256: \`${apk_sha}\`"
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo '- Signing: generated Android debug key (pilot installation only)'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: sautiforge-android-pilot-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
